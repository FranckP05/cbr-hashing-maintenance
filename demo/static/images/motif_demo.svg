<svg xmlns="http://www.w3.org/2000/svg" viewBox="432.57 -1241.82 511.37 444.00" width="100%" height="100%">
  <defs>
    <style>
      .bg-circle {
        mix-blend-mode: multiply;
      }
      .icon-path {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Arrière-plan : Formes circulaires pastel -->
  <g id="background-ellipses">
    <!-- Cercle Jaune (Haut Droit) -->
    <ellipse cx="765.42" cy="-1083.82" rx="124" ry="128" fill="#FDE047" opacity="0.35" class="bg-circle" />
    <!-- Cercle Gris (Bas Droit) -->
    <ellipse cx="736.80" cy="-955.82" rx="124" ry="128" fill="#E5E7EB" opacity="0.4" class="bg-circle" />
    <!-- Cercle Violet (Gauche) -->
    <ellipse cx="612.81" cy="-1027.82" rx="124" ry="128" fill="#DDD6FE" opacity="0.45" class="bg-circle" />
  </g>

  <!-- Groupe d'icônes vectorielles -->
